<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستعرض ملفات مدرسة تحفيظ القرآن بالبجادية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-navy: #111111;
            --navy-light: #1e293b;
            --accent-gold: #c29958;
            --accent-gold-bright: #e5bc7e;
            --text-light: #f8fafc;
            --white: #ffffff;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--primary-navy);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        .bg-elements {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .geo-shape {
            position: absolute;
            border: 1.5px solid rgba(194, 153, 88, 0.15);
            animation: rotateShape 25s infinite linear;
        }
        .shape-1 { width: 150px; height: 150px; top: 10%; left: -40px; transform: rotate(45deg); }
        .shape-2 { width: 280px; height: 280px; bottom: 20%; right: -100px; border-radius: 40px; animation-duration: 40s; }
        
        @keyframes rotateShape {
            from { transform: rotate(0deg); opacity: 0.1; }
            50% { opacity: 0.3; transform: rotate(180deg) scale(1.1); }
            to { transform: rotate(360deg); opacity: 0.1; }
        }

        .glow-bg {
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(194, 153, 88, 0.1) 0%, transparent 75%);
            border-radius: 50%;
            animation: floatGlow 18s infinite ease-in-out;
        }
        .glow-1 { top: -150px; right: -150px; }
        .glow-2 { bottom: -200px; left: -200px; animation-delay: -7s; }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.1); }
        }

        header {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 20px 10px;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 35px;
        }

        .icon-circle {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(194, 153, 88, 0.3);
            border-radius: 50%;
            animation: ripple 3.5s infinite ease-out;
            z-index: 1;
        }
        .c1 { width: 130px; height: 130px; }
        .c2 { width: 180px; height: 180px; animation-delay: 1.2s; }

        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
        }

        .logo-icon-main {
            position: relative;
            width: 95px; height: 95px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #8a6d3d 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: var(--primary-navy);
            z-index: 2;
            box-shadow: 0 15px 35px rgba(194, 153, 88, 0.4);
            animation: professionalFloat 4s ease-in-out infinite;
        }

        @keyframes professionalFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h2 { font-size: 1.6rem; font-weight: 800; color: var(--accent-gold); margin-top: 15px; line-height: 1.4; text-align: center;}

        .quote-container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            margin: 40px auto;
            padding: 2px;
            border-radius: 30px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .quote-content {
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 28px;
            text-align: center;
        }

        .quote-text {
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            line-height: 1.8;
            color: var(--text-light);
        }

        .quote-author {
            margin-top: 15px;
            color: var(--accent-gold);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .quote-author::before, .quote-author::after { content: ""; width: 20px; height: 1px; background: var(--accent-gold); opacity: 0.5; }

        .container {
            position: relative;
            z-index: 1;
            background-color: var(--white);
            flex-grow: 1;
            border-radius: 50px 50px 0 0;
            padding: 50px 25px;
            max-width: 650px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 -20px 60px rgba(0,0,0,0.3);
        }

        .main-btn {
            width: 100%; padding: 20px; border-radius: 20px; font-size: 1.1rem; font-weight: 700; text-decoration: none;
            display: flex; justify-content: space-between; align-items: center; transition: var(--transition); color: var(--navy-light);
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
        }

        .btn-text { display: flex; align-items: center; gap: 15px; }

        .btn-text i {
            width: 45px; height: 45px;
            background: var(--white);
            color: var(--accent-gold);
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px; font-size: 1.2rem; transition: var(--transition);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .main-btn:hover { 
            transform: scale(1.02);
            background: var(--primary-navy);
            color: var(--white);
            border-color: var(--primary-navy);
        }

        .main-btn:hover .btn-text i { background: var(--accent-gold); color: var(--primary-navy); }

        footer { 
            background: white; 
            text-align: center; 
            padding: 30px 20px; 
            position: relative;
            z-index: 1;
        }
        
        .copyright { color: #64748b; font-size: 0.9rem; }
        .copyright span { 
            color: var(--primary-navy); 
            font-weight: 900; 
            border-bottom: 2px solid var(--accent-gold);
        }
    </style>
</head>
<body>

    <div class="bg-elements">
        <div class="glow-bg glow-1"></div>
        <div class="glow-bg glow-2"></div>
        <div class="geo-shape shape-1"></div>
        <div class="geo-shape shape-2"></div>
    </div>

    <header>
        <div class="logo-wrapper">
            <div class="icon-circle c1"></div>
            <div class="icon-circle c2"></div>
            <div class="logo-icon-main">
                <i class="fas fa-file-signature"></i>
            </div>
        </div>
        <h2>
            مستعرض ملفات مدرسة<br>
            تحفيظ القرآن بالبجادية
        </h2>
    </header>

    <div class="quote-container">
        <div class="quote-content">
            <p class="quote-text">
                " العلمُ ليسَ بما حُفِظ ، إنما العلمُ بما نُفِع ؛ فليكن طموحُكم عنانَ السماء ، وإخلاصُكم نوراً يملأُ الآفاق "
            </p>
            <div class="quote-author">إدارة المدرسة</div>
        </div>
    </div>

    <div class="container">
        <a href="https://nmoschool.github.io/teacher" class="main-btn">
            <div class="btn-text">
                <i class="fas fa-chalkboard-teacher"></i>
                <span>قسم المعلمين</span>
            </div>
            <i class="fas fa-chevron-left"></i>
        </a>

        <a href="https://c.autorasd.com/certificates/b0a58f5f8694310190b05d2d60beff99" class="main-btn">
            <div class="btn-text">
                <i class="fas fa-chart-line"></i>
                <span>نتائج الطلاب</span>
            </div>
            <i class="fas fa-chevron-left"></i>
        </a>
    </div>

    <footer>
        <div class="copyright">حقوق برمجة وتطوير &copy; 2026 | <span>NMO</span></div>
    </footer>

    <script>
        window.addEventListener('scroll', function() {
            sessionStorage.setItem('scrollPosition', window.scrollY);
        });

        window.addEventListener('load', function() {
            if (sessionStorage.getItem('scrollPosition') !== null) {
                window.scrollTo({
                    top: parseInt(sessionStorage.getItem('scrollPosition')),
                    behavior: 'smooth'
                });
            }
        });
    </script>

</body>
</html>
